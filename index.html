<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dividados Pesquisa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <header class="page-header">
        <div>
          <p class="eyebrow">Pesquisa de campo</p>
          <h1>Dividados Pesquisa</h1>
        </div>
        <a class="small-link" href="dashboard.html">Dashboard</a>
      </header>

      <section id="offlineBox" class="offline-box">
        <div>
          <strong id="connectionStatus">Verificando conexao...</strong>
          <span id="pendingCountText">0 pesquisas pendentes de sincronizacao</span>
        </div>
        <button type="button" id="syncNowButton" class="secondary-button">Sincronizar agora</button>
      </section>

      <div id="message" class="message" hidden></div>

      <form id="surveyForm" autocomplete="off">
        <section class="form-section">
          <h2>Perfil do entrevistado</h2>

          <label>
            Nome do pesquisador
            <input type="text" id="pesquisador" name="pesquisador" required>
          </label>

          <label>
            Cidade
            <input type="text" id="cidade" name="cidade" list="cidadeOptions" placeholder="Digite ou selecione a cidade" required>
            <datalist id="cidadeOptions"></datalist>
          </label>

          <label>
            Regiao/Bairro
            <input type="text" id="regiao" name="regiao" required>
          </label>

          <label>
            Endereco
            <input type="text" id="endereco" name="endereco" required>
          </label>

          <div class="grid-two">
            <label>
              Sexo
              <select id="sexo" name="sexo" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
              </select>
            </label>

            <label>
              Faixa etaria
              <select id="faixaEtaria" name="faixaEtaria" required>
                <option value="">Selecione</option>
                <option value="0 a 18">0 a 18</option>
                <option value="19 a 30">19 a 30</option>
                <option value="30 a 55">30 a 55</option>
                <option value="Acima de 55">Acima de 55</option>
              </select>
            </label>
          </div>

          <button type="button" id="checkQuotaButton" class="secondary-button">
            Verificar cota
          </button>
        </section>

        <section id="questionsSection" class="form-section hidden">
          <h2>Perguntas da pesquisa</h2>

          <div id="dynamicQuestions">
            <p class="muted-text">Carregando perguntas...</p>
          </div>

          <button type="submit" id="submitButton" class="primary-button">
            Enviar
          </button>
        </section>
      </form>
    </section>
  </main>

  <script src="script.js?v=9"></script>
</body>
</html>
