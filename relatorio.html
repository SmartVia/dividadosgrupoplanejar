<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Executivo - Dividados Pesquisa</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="report-page">
  <header class="report-toolbar no-print">
    <div>
      <p class="eyebrow">Relatório PDF</p>
      <h1>Dividados Pesquisa</h1>
    </div>
    <div class="header-actions">
      <a class="secondary-button" href="dashboard.html">Voltar ao dashboard</a>
      <button id="printReportButton" class="primary-button" type="button" disabled>Imprimir / Salvar PDF</button>
    </div>
  </header>

  <div id="reportMessage" class="message info no-print">Carregando dados do relatório...</div>

  <main id="reportRoot" class="report-document">
    <section class="report-loading">
      <h2>Preparando relatório executivo...</h2>
      <p>Os dados serão carregados do Google Sheets.</p>
    </section>
  </main>

  <script src="relatorio.js?v=2"></script>
</body>
</html>
